cli.help=Syleks — sessions d'IA locales persistantes\nUsage : syleks [chat] [-c|--continue | -s|--session <id> | --new | --fork <id>]\n       syleks config init [--defaults]\n       syleks config update\n       syleks secrets migrate|encrypt\n       syleks secrets rotate <reference-or-encrypted-value>\n       syleks secrets revoke <syleks-secret:uuid>\n       syleks trust inspect|revoke\n       syleks trust grant <reviewed-sha256>\n       syleks session list\n       syleks session delete <id>\n       syleks session export <id>\n       syleks session import <file>\n       syleks session fork <id> [message-id]\n       syleks session messages|changes|diff|undo|redo <id>\n       syleks auth login|logout chatgpt [account-id]\n       syleks auth login openai-api\n       syleks auth status|accounts\n       syleks auth use <account-id>\n       syleks provider list|use <provider-id>\n       syleks model list|use <model-id>\n       syleks mcp list|tools\n       syleks mcp auth|logout <server-id>\nSans option : ouvre l'interface et propose les sessions de ce projet.\n-c : reprend la dernière session, ou en crée une si le projet n'en a pas.\nconfig update : rafraîchit le schéma fourni et migre les réglages globaux, avec sauvegarde des fichiers modifiés.\nconfig init : ouvre le formulaire pour créer ou mettre à jour le fournisseur et le modèle.\nDans le chat : /config (Ctrl+G) ouvre la configuration ; Enregistrer propose de redémarrer.\nUne entrée redirigée utilise des invites ligne à ligne ; --defaults et cette configuration préservent les fichiers existants.\nSecrets : migre les clés de fournisseur, en-têtes MCP et l'environnement vers des références liées à leur destination.\nencrypt stocke un chiffré en ligne avec la clé Base64 de 32 octets dans SYLEKS_CONFIG_KEY.\nrotate lit un remplacement depuis la console (masqué) ou une ligne sur l'entrée standard ; revoke retire la référence localement.\nUn trousseau est requis pour les nouvelles références, sauf si SYLEKS_CREDENTIAL_BACKEND=file autorise explicitement des fichiers non chiffrés.\nRedémarrez les discussions après une migration, rotation ou révocation. Voir docs/secret-storage.md.\nHTTP distant : examinez insecure_http_origins dans le agent-config.json global ; redémarrez pour appliquer ou révoquer.\nOutils web : destinations publiques par défaut ; web_private_origins autorise des services privés.\nCommandes : isolation Linux restreinte par défaut ; command_sandbox règle le mode et le réseau.\nApprobations : /approve remember retient l'action exacte 15 minutes ; /approvals liste ou révoque ces autorisations.\nSi le bac à sable n'est pas disponible, les commandes sont refusées ; le mode unrestricted est un choix global explicite.\n--defaults : saute les questions et utilise le fournisseur et le modèle fournis, sans clé d'API.\nLes exports sont du JSON sur la sortie standard et peuvent contenir des données confidentielles. Redirigez-les explicitement.\nLes identifiants de session sont limités au projet courant. --help affiche ce message.\n
