name: Java CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SYLEKS_SANDBOX_TESTS: required
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      # No shared Maven/scanner caches: PR code cannot seed later trusted builds.
      - name: Isolate Maven downloads
        run: echo "MAVEN_OPTS=-Dmaven.repo.local=$RUNNER_TEMP/syleks-maven" >> "$GITHUB_ENV"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: false
      - name: Check scanner policy and failure behavior
        run: python3 -m unittest discover -s .github/security -p 'test_*.py' -v
      - name: Scan tracked repository files for secrets
        run: python3 .github/security/scan.py secrets --output "$RUNNER_TEMP/security"
      - name: Prepare required Linux command sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Disposable CI runner: permit the unprivileged namespaces used by Bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          bwrap --version
          systemd-run --version
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify
      - name: Check packaged CLI and SQLite runtime
        env:
          SYLEKS_DATA_DIR: ${{ runner.temp }}/syleks-data
        run: |
          java --enable-native-access=ALL-UNNAMED -jar target/syleks-0.1.0-SNAPSHOT.jar --help
          java --enable-native-access=ALL-UNNAMED -jar target/syleks-0.1.0-SNAPSHOT.jar session list
      - name: Resolve build plugins including native and release profiles
        run: >-
          mvn -B --no-transfer-progress -Pnative,release
          org.apache.maven.plugins:maven-dependency-plugin:3.11.0:resolve-plugins
          -DexcludeTransitive=false
      - name: Scan build dependencies and shaded artifact; generate inventories
        env:
          SCAN_MAVEN_REPO: ${{ runner.temp }}/syleks-maven
        run: >-
          python3 .github/security/scan.py dependencies --output "$RUNNER_TEMP/security"
          --maven-repo "$SCAN_MAVEN_REPO" --jar target/syleks-0.1.0-SNAPSHOT.jar
      - name: Archive performance fixtures and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-reports
          path: |
            target/performance/
            target/surefire-reports/
          retention-days: 7
      - name: Archive dependency inventories and safe scanner summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          retention-days: 7
          path: |
            ${{ runner.temp }}/security/*-inventory.cdx.json
            ${{ runner.temp }}/security/*-vulnerabilities.json
            ${{ runner.temp }}/security/status.json
            ${{ runner.temp }}/security/secrets-summary.json
