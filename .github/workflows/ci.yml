name: Java CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify
      - name: Check packaged CLI and SQLite runtime
        env:
          SYLEKS_DATA_DIR: ${{ runner.temp }}/syleks-data
        run: |
          java --enable-native-access=ALL-UNNAMED -jar target/syleks-0.1.0-SNAPSHOT.jar --help
          java --enable-native-access=ALL-UNNAMED -jar target/syleks-0.1.0-SNAPSHOT.jar session list
      - name: Check terminal navigation, resizing and streaming cancellation
        run: python3 scripts/phase8-smoke.py
      - name: Archive performance fixtures and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            target/performance/
            target/surefire-reports/
